<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<title>Cadastro</title>
</head>
<body>
	<h1>Cadastro</h1>
	<form action="processaCadastro.php" method="post">
		<label for="nome1">Nome completo:</label><br>
		<input type="text" id="nome1" name="nome1" required><br><br>

		<label for="idade2">Idade:</label><br>
		<input type="number" id="idade2" name="idade2" min="0" required><br><br>

		<label for="profissao3">Profissão:</label><br>
		<input type="text" id="profissao3" name="profissao3" required><br><br>

		<label for="salario4">Salário pretendido:</label><br>
		<input type="number" step="0.01" id="salario4" name="salario4" required><br><br>

		<label for="experiencia5">Experiência anterior:</label><br>
		<textarea id="experiencia5" name="experiencia5" rows="6" cols="50" required></textarea><br><br>

		<button type="submit">Enviar cadastro</button>
	</form>
</body>
</html>
